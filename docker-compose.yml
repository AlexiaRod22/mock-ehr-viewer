services:

  postgres:

    image: postgres:16

    environment:

      POSTGRES_DB: hapi

      POSTGRES_USER: hapi

      POSTGRES_PASSWORD: hapi

    ports:

      - "5432:5432"

    volumes:

      - postgres-data:/var/lib/postgresql/data

  hapi-fhir:

    image: hapiproject/hapi:latest

    ports:

      - "8080:8080"
      
    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi

      SPRING_DATASOURCE_USERNAME: hapi

      SPRING_DATASOURCE_PASSWORD: hapi

    depends_on:
      - postgres

volumes:

  postgres-data: