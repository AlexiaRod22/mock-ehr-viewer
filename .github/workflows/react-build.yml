name: Build Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  react-build:

    runs-on: ubuntu-latest

    steps:

      - name: Download Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build React
        run: npm run build

  docker-build:

    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t mock-ehr-viewer .